<script>
(function () {
'use strict';
// ====================== Datos fijos ======================
const CATEGORIAS = ["Alimentos y Bebidas","Limpieza e Higiene","Indumentaria","Electrónica","Ferretería","Muebles y Decoración","Salud y Belleza","Papelería","Juguetes","Automotriz","Construcción","Otro"];
const WA_SUPPORT = '5493415628884';
const SUP_EMAILS = ['anibalrossia@gmail.com', 'soporte@ventiungo.app'];
const AUTH_DOMAIN = 'redpro.ventiungo.app';
const COL = 'redpro', LOGIN = 'redpro_login';

// ====================== Utilidades ======================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cuitDigits = s => String(s || '').replace(/\D/g, '');
const fmtCuit = d => d.length === 11 ? d.slice(0, 2) + '-' + d.slice(2, 10) + '-' + d.slice(10) : d;
function cuitValido(d) {
  if (!/^\d{11}$/.test(d)) return false;
  const w = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
  let s = 0; for (let i = 0; i < 10; i++) s += +d[i] * w[i];
  let v = 11 - (s % 11); if (v === 11) v = 0; if (v === 10) v = 9;
  return v === +d[10];
}
function toast(text, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'success');
  el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function waNumber(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = d.slice(1);
  if (!d.startsWith('54')) d = '54' + (d.length === 10 && !d.startsWith('9') ? '9' : '') + d;
  return d;
}
const initial = n => esc((String(n || '?').trim()[0] || '?').toUpperCase());
const avatar = (u, cls) => `<div class="supplier-avatar ${cls || ''}">${u.logo ? `<img src="${esc(u.logo)}" alt="" class="w-full h-full object-cover">` : initial(u.name)}</div>`;
const badge = (plan, long) => plan === 'destacado' ? `<span class="badge-destacado">⭐ ${long ? 'Proveedor Destacado' : 'Destacado'}</span>` : `<span class="badge-basico">${long ? 'Plan Básico' : 'Básico'}</span>`;

// Achica la imagen del logo (para que la base de datos no se llene)
function readLogo(file) {
  return new Promise((ok, fail) => {
    if (!file) return ok(null);
    if (!/^image\//.test(file.type)) return fail(new Error('tipo'));
    if (file.size > 500 * 1024) return fail(new Error('peso'));
    const fr = new FileReader();
    fr.onerror = () => fail(new Error('leer'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => fail(new Error('leer'));
      img.onload = () => {
        const S = 256, c = document.createElement('canvas');
        const k = Math.min(1, S / Math.max(img.width, img.height));
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ====================== Firebase ======================
let DB = null, AUTH = null;
function fb() {
  if (DB) return true;
  try {
    const app = firebase.apps.find(a => a.name === 'redpro') || firebase.initializeApp(window.VENTIUN_FIREBASE, 'redpro');
    DB = app.firestore(); AUTH = app.auth();
    return true;
  } catch (e) { console.warn(e); return false; }
}
// Sesión aparte para crear cuentas desde soporte sin cerrar la propia
function secAuth() {
  const app = firebase.apps.find(a => a.name === 'redpro-sec') || firebase.initializeApp(window.VENTIUN_FIREBASE, 'redpro-sec');
  return app.auth();
}
const isSupportUser = u => !!(u && u.email && SUP_EMAILS.includes(u.email.toLowerCase()));
function errMsg(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/network|unavailable/.test(c)) return 'Sin conexión. Revisá internet e intentá de nuevo.';
  if (/permission/.test(c)) return 'No tenés permiso para hacer eso.';
  if (/too-many/.test(c)) return 'Demasiados intentos. Esperá unos minutos.';
  return 'Ocurrió un error. Intentá nuevamente.';
}

// ====================== Estado ======================
const S = { view: 'home', role: null, user: null, step: 1, form: null, logo: null, search: '', suppliers: null, admin: null, adminTab: 'comerciantes', busy: false, soporte: false };

function go(view) { S.view = view; render(); window.scrollTo(0, 0); }

// ====================== Encabezado ======================
function brand(onLight) {

    <span class="brand-mark" aria-hidden="true">🤝</span>
    <span class="brand-txt"><b>Red<span>Pro</span></b><small>Red de abastecimiento</small></span>
  </a>`;
}
// Actualizar la app sin cerrar la sesión
function reloadBtn() {
  return `<button class="icon-btn" data-act="reload" title="Actualizar la app" aria-label="Actualizar la app"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>`;
}
function actualizarApp() {
  const go = () => location.reload();
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}).then(go);
      setTimeout(go, 1500);
      return;
    }
  } catch (e) {}
  go();
}
function header(opts) {
  opts = opts || {};
  const back = opts.back ? `<button class="icon-btn" data-act="back" aria-label="Volver"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>` : '';
  const right = (typeof installBtnHtml === 'function' ? installBtnHtml() : '') + reloadBtn() + (opts.logout ? `<button class="hdr-btn" data-act="logout">Salir</button>` : '');

    <div class="flex items-center gap-2 shrink-0">${right}</div>
  </header>`;
}

// ====================== Página de inicio (landing) ======================
function landing() {
  const steps = [['01', '📝', 'Registrate', 'Creá tu cuenta como comerciante o proveedor en menos de 2 minutos.'], ['02', '🎯', 'Elegí tu plan', 'Empezá gratis con el plan Básico o potenciá tu visibilidad con Destacado.'], ['03', '🔍', 'Explorá', 'Buscá y filtrá proveedores por categoría, plan y ubicación.'], ['04', '🤝', 'Conectate', 'Contactá directamente con proveedores y hacé crecer tu negocio.']];
  const bens = [['bg-verde-pro', '🚀', 'Acceso inmediato', 'Conectate con cientos de proveedores verificados al instante. Sin intermediarios, sin demoras.'], ['bg-amarillo-pro', '💎', 'Proveedores destacados', 'Los proveedores con plan Destacado tienen mayor visibilidad y acceso exclusivo a más comerciantes.'], ['bg-verde-pro', '🔒', 'Seguro y confiable', 'Verificamos el CUIT de cada usuario para garantizar que todos los contactos sean negocios reales.']];
  const li = (c, t) => `<li class="flex items-center gap-3 text-gray-700"><span class="${c} text-lg">${c === 'text-verde-pro' ? '✓' : '★'}</span> ${t}</li>`;
  return `<div class="min-h-screen bg-white">
  <header class="bg-verde-pro text-white sticky top-0 z-50" style="padding-top:env(safe-area-inset-top)"><div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
    ${brand()}
    <div class="flex items-center gap-2">${typeof installBtnHtml === 'function' ? installBtnHtml() : ''}${reloadBtn()}<a href="#app" class="bg-amarillo-pro text-verde-pro font-bold px-5 py-2 rounded-xl text-sm hover:bg-yellow-300 transition-colors">Ingresar</a></div>
  </div></header>
  <section class="landing-hero text-white py-24 px-4 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(circle at 20% 50%, #facc15 0%, transparent 60%), radial-gradient(circle at 80% 20%, #22c55e 0%, transparent 60%)"></div>
    <div class="max-w-4xl mx-auto text-center relative">
      <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-medium mb-6 text-green-200"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>Plataforma activa en Argentina</div>
      <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-6 leading-tight">Conectamos <span class="gradient-text">comerciantes</span> con proveedores</h1>
      <p class="text-xl md:text-2xl text-green-100 max-w-2xl mx-auto mb-10 leading-relaxed">RedPro es la red de abastecimiento que simplifica la conexión entre negocios y sus proveedores de confianza.</p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">

        <a href="#como-funciona" class="inline-flex items-center justify-center gap-2 bg-white/10 text-white font-semibold px-8 py-4 rounded-2xl text-lg hover:bg-white/20 transition-colors border border-white/20">Cómo funciona</a>
      </div>
      <div class="mt-16 grid grid-cols-3 gap-8 max-w-lg mx-auto">
        <div class="text-center"><div class="text-3xl font-black text-amarillo-pro">500+</div><div class="text-sm text-green-300 mt-1">Proveedores</div></div>
        <div class="text-center"><div class="text-3xl font-black text-amarillo-pro">1.2K+</div><div class="text-sm text-green-300 mt-1">Comerciantes</div></div>
        <div class="text-center"><div class="text-3xl font-black text-amarillo-pro">24hs</div><div class="text-sm text-green-300 mt-1">Soporte</div></div>
      </div>
    </div>
  </section>

    <div class="text-center mb-16"><p class="text-verde-pro font-semibold text-sm uppercase tracking-widest mb-3">Proceso simple</p><h2 class="text-4xl font-black text-gray-900 mb-4">¿Cómo funciona?</h2><p class="text-gray-600 text-lg max-w-xl mx-auto">En cuatro pasos simples, tu negocio estará conectado con los mejores proveedores.</p></div>
    <div class="grid md:grid-cols-4 gap-6">${steps.map(s => `<div class="landing-card p-6 text-center"><div class="text-xs font-black text-verde-pro bg-green-50 inline-block px-2 py-1 rounded-full mb-4">${s[0]}</div><div class="text-4xl mb-3">${s[1]}</div><h3 class="text-lg font-bold text-gray-900 mb-2">${s[2]}</h3><p class="text-gray-600 text-sm leading-relaxed">${s[3]}</p></div>`).join('')}</div>

    <div class="text-center mb-16"><p class="text-verde-pro font-semibold text-sm uppercase tracking-widest mb-3">Beneficios</p><h2 class="text-4xl font-black text-gray-900 mb-4">Por qué elegir RedPro</h2></div>

    const q = S.search.trim().toLowerCase();
    list = list.filter(x => u.plan === 'destacado' || x.plan !== 'destacado')
      .filter(x => !q || (x.name || '').toLowerCase().includes(q) || (x.category || '').toLowerCase().includes(q))

    body = !list.length ? `<div class="text-center py-12 text-gray-400"><div class="text-3xl mb-2">🔍</div><p>No se encontraron proveedores</p></div>`

function render() {
  const appMode = location.hash === '#app' || S.view !== 'home' || S.inApp;
  const root = $('#root');
  if (!appMode) { root.innerHTML = landing(); return; }
  const V = { home: vHome, role: vRole, register: vRegister, login: vLogin, merchant: vMerchant, supplier: vSupplier, editProfile: vEdit, admin: vAdmin }[S.view] || vHome;
  root.innerHTML = `<div class="app-shell">${V()}</div>`;
  if (S.view === 'login') { const c = $('#lCuit'); if (c && !c.value) c.focus(); else { const pw = $('#lPass'); if (pw) pw.focus(); } }
}

// ====================== Acciones ======================
function readStep1() {
  const f = S.form;
  f.cuit = $('#fCuit').value.trim(); f.name = $('#fName').value.trim(); f.phone = $('#fPhone').value.trim();
  if ($('#fCat')) f.category = $('#fCat').value;
  f.password = $('#fPass').value;
}
function validStep1() {
  const f = S.form, d = cuitDigits(f.cuit);
  if (!d) return toast('Ingresá tu CUIT', 'error'), false;
  if (!cuitValido(d)) return toast('El CUIT no es válido. Revisá los 11 números.', 'error'), false;
  if (!f.name) return toast('Ingresá tu nombre', 'error'), false;
  if (!f.phone) return toast('Ingresá tu teléfono', 'error'), false;
  if (S.role === 'proveedor' && !f.category) return toast('Seleccioná una categoría', 'error'), false;
  if (!f.password || f.password.length < 6) return toast('La contraseña debe tener al menos 6 caracteres', 'error'), false;
  return true;
}

async function loadProfile(uid) {
  const q = await DB.collection(COL).where('uid', '==', uid).limit(1).get();
  if (q.empty) return null;
  return q.docs[0].data();
}
function enter(user, welcome) {
  S.user = user; S.soporte = false;
  S.suppliers = null; S.search = '';
  go(user.role === 'comerciante' ? 'merchant' : 'supplier');
  if (welcome) toast(welcome);
  if (user.role === 'comerciante') loadSuppliers();
}
async function loadSuppliers() {
  try {
    const q = await DB.collection(COL).where('role', '==', 'proveedor').get();
    S.suppliers = q.docs.map(d => d.data());
  } catch (e) { S.suppliers = []; toast('Error al cargar proveedores', 'error'); }
  if (S.view === 'merchant') { const keep = document.activeElement && document.activeElement.id === 'search'; render(); if (keep) { const s = $('#search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}

async function register() {
  const f = S.form;
  f.email = $('#fEmail').value.trim();
  if (!f.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) return toast('Ingresá tu email', 'error');
  if (!fb()) return toast('Sin conexión con la base de datos', 'error');
  const cuit = cuitDigits(f.cuit);
  S.busy = true; render();
  try {
    const ex = await DB.collection(LOGIN).doc(cuit).get();
    if (ex.exists) throw { code: 'existe' };
    const authEmail = cuit + '@' + AUTH_DOMAIN;
    let cred;
    try { cred = await AUTH.createUserWithEmailAndPassword(authEmail, f.password); }
    catch (e) {
      // Cuenta borrada desde soporte: la credencial quedó, se reutiliza si la clave coincide
      if (e.code === 'auth/email-already-in-use') {
        try { cred = await AUTH.signInWithEmailAndPassword(authEmail, f.password); } catch (e2) { throw { code: 'existe' }; }
      } else throw e;
    }
    const uid = cred.user.uid;
    const user = { cuit, uid, role: S.role, name: f.name, phone: f.phone, email: f.email, category: S.role === 'proveedor' ? f.category : '', plan: f.plan, logo: S.logo || null, creado: Date.now() };
    const b = DB.batch();
    b.set(DB.collection(COL).doc(cuit), user);
    b.set(DB.collection(LOGIN).doc(cuit), { authEmail, uid });
    await b.commit();
    S.busy = false;
    enter(user, '¡Registro exitoso! Bienvenido/a a RedPro 🎉');
  } catch (e) {
    S.busy = false; render();
    toast(e && e.code === 'existe' ? 'Ya existe una cuenta con ese CUIT. Iniciá sesión.' : errMsg(e), 'error');
  }
}

async function login(cuitIn, pass) {
  S.lCuit = cuitIn;
  if (!cuitIn.trim() || !pass) return toast('Completá todos los campos', 'error');
  if (!fb()) return toast('Sin conexión con la base de datos', 'error');
  S.busy = true; render();
  try {
    // Soporte de VentiunGo: usuario "Ventiungo" y su contraseña
    if (cuitIn.trim().toLowerCase() === 'ventiungo') {
      let ok = null;
      for (const em of SUP_EMAILS) {
        try { ok = await AUTH.signInWithEmailAndPassword(em, pass); break; }
        catch (e) { if (!/user-not-found|invalid-credential|invalid-login|wrong-password|invalid-email/.test(e.code || '')) throw e; }
      }
      if (!ok) throw { code: 'clave' };
      S.busy = false; openAdmin(); toast('Soporte VentiunGo: panel de administración'); return;
    }
    const cuit = cuitDigits(cuitIn);
    const l = await DB.collection(LOGIN).doc(cuit).get();
    if (!l.exists) throw { code: 'clave' };
    try { await AUTH.signInWithEmailAndPassword(l.data().authEmail, pass); }
    catch (e) { if (/user-not-found|invalid-credential|invalid-login|wrong-password/.test(e.code || '')) throw { code: 'clave' }; throw e; }
    const user = await loadProfile(AUTH.currentUser.uid);
    if (!user) { await AUTH.signOut(); throw { code: 'borrada' }; }
    S.busy = false;
    enter(user, `¡Bienvenido/a, ${user.name}!`);
  } catch (e) {
    S.busy = false; render();
    toast(e.code === 'clave' ? 'CUIT o contraseña incorrectos' : e.code === 'borrada' ? 'Esa cuenta fue dada de baja. Escribinos a soporte.' : errMsg(e), 'error');
  }
}

async function openAdmin() {
  S.soporte = true; S.admin = null; S.user = null; go('admin');
  if (!DB) return;
  try {
    const q = await DB.collection(COL).get();
    S.admin = q.docs.map(d => d.data()).sort((a, b) => (b.creado || 0) - (a.creado || 0));
  } catch (e) { S.admin = []; toast('Error al cargar usuarios', 'error'); }
  if (S.view === 'admin') render();
}

async function saveProfile() {
  const u = S.user, f = S.form;
  f.name = $('#eName').value.trim(); f.phone = $('#ePhone').value.trim(); f.email = $('#eEmail').value.trim();
  if ($('#eCat')) f.category = $('#eCat').value;
  f.password = $('#ePass').value;
  const old = ($('#eOld') || {}).value || '';
  if (!f.name) return toast('Ingresá el nombre', 'error');
  if (f.password && f.password.length < 6) return toast('La contraseña debe tener al menos 6 caracteres', 'error');
  S.busy = true; render();
  try {
    if (f.password) {
      if (!old) throw { code: 'old' };
      const cu = AUTH.currentUser;
      await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, old)).catch(() => { throw { code: 'oldbad' }; });
      await cu.updatePassword(f.password);
    }
    const upd = { name: f.name, phone: f.phone, email: f.email, category: u.role === 'proveedor' ? f.category : '', plan: f.plan, logo: S.logo || null };
    await DB.collection(COL).doc(u.cuit).update(upd);
    S.busy = false;
    S.user = Object.assign({}, u, upd);
    go(u.role === 'comerciante' ? 'merchant' : 'supplier');
    toast('Perfil actualizado correctamente');
    if (u.role === 'comerciante') loadSuppliers();
  } catch (e) {
    S.busy = false; render();
    toast(e.code === 'old' ? 'Escribí tu contraseña actual para cambiarla' : e.code === 'oldbad' ? 'La contraseña actual no es correcta' : 'Error al actualizar. Intentá nuevamente.', 'error');
  }
}

async function logout() {
  try { if (AUTH) await AUTH.signOut(); } catch (e) {}
  S.user = null; S.soporte = false; S.admin = null; S.suppliers = null;
  go('home'); toast('Sesión cerrada', 'info');
}

// Ventanita simple (pedir dato o confirmar)
function modal(html, buttons) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">${html}<div class="flex gap-2 mt-5">${buttons.map((b, i) => `<button data-i="${i}" class="${b.cls || 'btn-primary'}" style="padding:.7rem 1rem">${b.text}</button>`).join('')}</div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 30);
    bg.addEventListener('click', e => {
      const t = e.target.closest('[data-i]');
      if (t) { const v = inp ? inp.value : true; bg.remove(); resolve(buttons[+t.dataset.i].ok ? v : null); }
      else if (e.target === bg) { bg.remove(); resolve(null); }
    });
  });
}

async function forgot() {
  const c = ($('#lCuit') || {}).value || '';
  const msg = 'Hola VentiunGo, olvidé mi contraseña de RedPro. Mi CUIT es: ' + (c.trim() || '(completar)') + '. ¿Me ayudan a cambiarla?';
  const ok = await modal(`<h3 class="text-lg font-black text-gray-900 mb-2">¿Olvidaste tu contraseña?</h3><p class="text-sm text-gray-600">Escribinos por WhatsApp con tu CUIT y te damos una contraseña nueva.</p>`,
    [{ text: 'Cancelar', cls: 'btn-secondary' }, { text: 'Escribir por WhatsApp', ok: true }]);
  if (ok) window.open('https://wa.me/' + WA_SUPPORT + '?text=' + encodeURIComponent(msg), '_blank');
}

// Soporte: dar una contraseña nueva a un usuario (crea una credencial nueva y la asocia al CUIT)
async function supportReset(cuit) {
  const m = (S.admin || []).find(x => x.cuit === cuit); if (!m) return;
  const pass = await modal(`<h3 class="text-lg font-black text-gray-900 mb-1">Nueva contraseña</h3><p class="text-sm text-gray-500 mb-3">${esc(m.name)} · ${esc(fmtCuit(cuit))}</p><input class="form-input" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">`,
    [{ text: 'Cancelar', cls: 'btn-secondary' }, { text: 'Guardar', ok: true }]);
  if (pass == null) return;
  if (pass.length < 6) return toast('La contraseña debe tener al menos 6 caracteres', 'error');
  try {
    const sa = secAuth();
    const authEmail = cuit + '.rst' + Date.now().toString(36) + '@' + AUTH_DOMAIN;
    const cred = await sa.createUserWithEmailAndPassword(authEmail, pass);
    const uid = cred.user.uid;
    await sa.signOut();
    const b = DB.batch();
    b.update(DB.collection(COL).doc(cuit), { uid });
    b.set(DB.collection(LOGIN).doc(cuit), { authEmail, uid });
    await b.commit();
    m.uid = uid;
    const wa = waNumber(m.phone);
    const text = `Hola ${m.name}, te dejamos tu nueva contraseña de RedPro: ${pass}\nIngresá con tu CUIT ${fmtCuit(cuit)}. Después podés cambiarla desde "Editar perfil".`;
    await modal(`<h3 class="text-lg font-black text-gray-900 mb-2">Contraseña cambiada</h3><p class="text-sm text-gray-600">${esc(m.name)} ya puede entrar con su CUIT y la contraseña nueva.</p>`,
      [{ text: 'Listo', cls: 'btn-secondary' }].concat(wa.length >= 12 ? [{ text: 'Avisarle por WhatsApp', ok: true }] : []))
      .then(v => { if (v) window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank'); });
  } catch (e) { toast(errMsg(e), 'error'); }
}
async function supportDelete(cuit) {
  const m = (S.admin || []).find(x => x.cuit === cuit); if (!m) return;
  const ok = await modal(`<h3 class="text-lg font-black text-gray-900 mb-2">¿Eliminar la cuenta?</h3><p class="text-sm text-gray-600">Se borra <b>${esc(m.name)}</b> (${esc(fmtCuit(cuit))}) de RedPro. No se puede deshacer.</p>`,
    [{ text: 'Cancelar', cls: 'btn-secondary' }, { text: 'Eliminar', ok: true, cls: 'btn-primary' }]);
  if (!ok) return;
  try {
    const b = DB.batch();
    b.delete(DB.collection(COL).doc(cuit)); b.delete(DB.collection(LOGIN).doc(cuit));
    await b.commit();
    S.admin = S.admin.filter(x => x.cuit !== cuit); render();
    toast(`${m.name} eliminado correctamente`);
  } catch (e) { toast('Error al eliminar', 'error'); }
}
async function supportPlan(cuit) {
  const m = (S.admin || []).find(x => x.cuit === cuit); if (!m) return;
  const plan = m.plan === 'destacado' ? 'basico' : 'destacado';
  try { await DB.collection(COL).doc(cuit).update({ plan }); m.plan = plan; render(); toast(`${m.name}: plan ${plan === 'destacado' ? 'Destacado' : 'Básico'}`); }
  catch (e) { toast(errMsg(e), 'error'); }
}

// ====================== Eventos ======================
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-act],[data-role],[data-plan],[data-tab],[data-del],[data-reset],[data-plan-toggle]');
  if (!t) return;
  if (t.dataset.go) {
    const v = t.dataset.go;
    if (v === 'editProfile') { const u = S.user; S.form = { name: u.name, phone: u.phone, email: u.email || '', category: u.category || '', plan: u.plan, password: '' }; S.logo = u.logo || null; }
    if (v === 'role' || v === 'login') S.busy = false;
    return go(v);
  }
  if (t.dataset.role) { S.role = t.dataset.role; S.step = 1; S.logo = null; S.form = { cuit: '', name: '', phone: '', category: '', password: '', email: '', plan: 'basico' }; return go('register'); }
  if (t.dataset.plan) {
    if (S.view === 'register' && S.step === 2) S.form.email = $('#fEmail').value;
    if (S.view === 'editProfile') { S.form.name = $('#eName').value; S.form.phone = $('#ePhone').value; S.form.email = $('#eEmail').value; if ($('#eCat')) S.form.category = $('#eCat').value; S.form.password = $('#ePass').value; }
    S.form.plan = t.dataset.plan; return render();
  }
  if (t.dataset.tab) { S.adminTab = t.dataset.tab; return render(); }
  if (t.dataset.del) return supportDelete(t.dataset.del);
  if (t.dataset.reset) return supportReset(t.dataset.reset);
  if (t.dataset.planToggle) return supportPlan(t.dataset.planToggle);
  const a = t.dataset.act;
  if (a === 'back') {
    if (S.view === 'register') { if (S.step === 2) { S.form.email = $('#fEmail').value; S.step = 1; return render(); } return go('role'); }
    if (S.view === 'editProfile') return go(S.user.role === 'comerciante' ? 'merchant' : 'supplier');
    return go('home');
  }
  if (a === 'next') { readStep1(); if (validStep1()) { S.step = 2; render(); } return; }
  if (a === 'register') return register();
  if (a === 'saveProfile') return saveProfile();
  if (a === 'logout') return logout();
  if (a === 'reload') return actualizarApp();
  if (a === 'forgot') return forgot();
  if (a === 'pickLogo') { const i = $('#logoInput'); if (i) i.click(); return; }
  if (a === 'terms' || a === 'privacy') {
    return modal(a === 'terms'
      ? `<h3 class="text-lg font-black text-gray-900 mb-2">Términos y Condiciones</h3><p class="text-sm text-gray-600">RedPro es un directorio que conecta comerciantes y proveedores dentro de la República Argentina. Cada usuario es responsable de los datos que publica y de los acuerdos que realice con otros usuarios. El plan Destacado tiene un costo mensual de $10.000.</p>`
      : `<h3 class="text-lg font-black text-gray-900 mb-2">Política de Privacidad</h3><p class="text-sm text-gray-600">Usamos tus datos (CUIT, nombre del negocio, teléfono, email y logo) solo para el funcionamiento de RedPro. Los datos de los proveedores se muestran a los comerciantes registrados. Podés pedir la baja de tu cuenta escribiendo a soporte.</p>`,
      [{ text: 'Cerrar', ok: true }]);
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'logoInput') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (S.view === 'register' && S.step === 1) readStep1();
    if (S.view === 'editProfile') { S.form.name = $('#eName').value; S.form.phone = $('#ePhone').value; S.form.email = $('#eEmail').value; if ($('#eCat')) S.form.category = $('#eCat').value; S.form.password = $('#ePass').value; }
    try { S.logo = await readLogo(file); render(); }
    catch (err) { toast(err.message === 'peso' ? 'La imagen debe ser menor a 500KB' : 'No se pudo leer la imagen', 'error'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    S.search = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = $('#search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {}
  }
  if (e.target.id === 'ePass') { const w = $('#eOldWrap'); if (w) w.hidden = !e.target.value; }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); login($('#lCuit').value, $('#lPass').value); }
});
window.addEventListener('hashchange', () => {
  if (location.hash === '#app') {
    S.inApp = true;
    if (S.view === 'home' && S.soporte) return openAdmin();
    if (S.view === 'home' && S.user) return enter(S.user);
    render(); window.scrollTo(0, 0);
  } else if (!location.hash) { S.inApp = false; S.view = 'home'; render(); window.scrollTo(0, 0); }
});

// ====================== Inicio ======================
S.inApp = location.hash === '#app';
render();
if (fb()) {
  let first = true;
  AUTH.onAuthStateChanged(async u => {
    if (!first) return; first = false;
    if (!u) return;
    // Sesión guardada: al entrar a la app va directo a su panel
    try {
      if (isSupportUser(u)) { S.soporte = true; if (S.inApp && S.view === 'home') openAdmin(); return; }
      const user = await loadProfile(u.uid);
      if (!user) return;
      S.user = user;
      if (S.inApp && S.view === 'home') enter(user);
    } catch (e) {}
  });
}
})();

<script>
// ===== Ojo para ver la contraseña que se escribe =====
(function () {
    var OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var SHUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function addEye(inp) {
        if (inp.dataset.eye) return;
        inp.dataset.eye = '1';
        var cs = getComputedStyle(inp);
        var wrap = document.createElement('span');
        wrap.style.position = 'relative';
        wrap.style.display = cs.display === 'inline' ? 'inline-block' : 'block';
        wrap.style.margin = cs.margin;
        if (cs.width && /swal2-input/.test(inp.className)) { wrap.style.width = cs.width; wrap.style.marginLeft = 'auto'; wrap.style.marginRight = 'auto'; }
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        inp.style.margin = '0';
        if (/swal2-input/.test(inp.className)) inp.style.width = '100%';
        inp.style.paddingRight = '44px';
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Mostrar contraseña');
        b.title = 'Mostrar contraseña';
        b.innerHTML = OPEN;
        b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:#6b7280;line-height:0;display:flex;align-items:center;justify-content:center';
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            var show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            b.innerHTML = show ? SHUT : OPEN;
            b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            b.title = b.getAttribute('aria-label');
            inp.focus();
        });
        wrap.appendChild(b);
    }
    function scan(root) {
        var list = (root || document).querySelectorAll ? (root || document).querySelectorAll('input[type="password"]:not([data-eye])') : [];
        for (var i = 0; i < list.length; i++) addEye(list[i]);
    }
    function start() {
        scan(document);
        new MutationObserver(function () { scan(document); }).observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

<script>
// ===== Instalar como app en el celular =====
var __installPrompt = null;
function appInstalada() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function installBtnHtml() {
  if (appInstalada()) return '';
  return '<button onclick="instalarApp()" class="install-btn" title="Instalar app en el celular" aria-label="Instalar app">⬇ Instalar</button>';
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); __installPrompt = e; });
function avisoInstalar(html) {
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"><h3 class="text-lg font-black text-gray-900 mb-3">Instalar RedPro</h3>' + html + '<button class="btn-primary mt-5">Entendido</button></div>';
  bg.addEventListener('click', function (e) { if (e.target === bg || e.target.tagName === 'BUTTON') bg.remove(); });
  document.body.appendChild(bg);
}
window.addEventListener('appinstalled', function () {
  __installPrompt = null;
  avisoInstalar('<p class="text-sm text-gray-600">¡Listo! Ya tenés RedPro en la pantalla de inicio de tu celular.</p>');
});
function instalarApp() {
  if (__installPrompt) {
    __installPrompt.prompt();
    __installPrompt.userChoice.finally(function () { __installPrompt = null; });
    return;
  }
  var ua = navigator.userAgent || '';
  var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  avisoInstalar(ios
    ? '<ol class="text-sm text-gray-700 list-decimal pl-5 space-y-1"><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elegí <b>Agregar a pantalla de inicio</b>.</li><li>Tocá <b>Agregar</b>.</li></ol>'
